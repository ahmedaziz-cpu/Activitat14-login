{% extends 'index.html' %}

{% block content %}
<h1 style="text-align: center; color: #007bff; margin-bottom: 30px;">Bienvenidos </h1>

<div id="container">

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <label for="username">Usuari</label>
        <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>

        <button type="submit">Inici Sessió</button>
    </form>

    <form action="{% url 'create_user' %}" method="get" style="margin-top: 20px;">
        <button type="submit" class="secondary-button">Crear usuario</button>
    </form>

    {% if error %}
        <p class="error-message">{{ error }}</p>
    {% endif %}

</div>

<style>
    .error-message {
        color: red;
        font-weight: bold;
        text-align: center;
        margin-top: 15px;
    }

    .secondary-button {
        background-color: #6c757d;
        color: white;
        border: none;
        padding: 12px;
        width: 100%;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .secondary-button:hover {
        background-color: #5a6268;
    }
</style>
{% endblock %}
